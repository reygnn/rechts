# ============================================================================
# VERSION CATALOG — rechts (minimal browser)
# ============================================================================
# Core versions are the shared com.github.reygnn.* family baseline. Bump the
# skeleton catalog first, then propagate here (per ~/.claude/CLAUDE.md).
#
# rechts is "baseline only": a single-page WebView browser needs nothing
# beyond the shared core — WebView is a platform component, no extra deps.
# ============================================================================

[versions]
agp                 = "9.2.1"
kotlin              = "2.3.21"
coreKtx             = "1.18.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose     = "1.13.0"
composeBom          = "2026.05.01"

# androidx.webkit — Profile API for optional, isolated private browsing
# (MULTI_PROFILE since 1.10.0). Project-specific, not part of the family core.
webkit              = "1.12.1"

# androidx.swiperefreshlayout — pull-to-refresh gesture around the WebView.
# A View component (not Compose): a WebView in AndroidView emits no nested
# scroll to Compose, so PullToRefreshBox can't see the pull; SwipeRefreshLayout
# reads the WebView's own canScrollVertically(-1) and fires only at the top.
swipeRefresh        = "1.1.0"

# Testing (JVM baseline: JUnit 4 + MockK + Turbine + coroutines-test).
# Robolectric only for the few tests that genuinely need the Android runtime
# (e.g. Intent parsing in web/ExternalScheme) — see app/src/test/CLAUDE.md.
junit               = "4.13.2"
mockk               = "1.14.9"
coroutinesTest      = "1.11.0"
turbine             = "1.2.1"
robolectric         = "4.16.1"

# Instrumented tests (androidTest) — only for behaviour that needs a real
# WebView/Chromium engine an emulator provides but Robolectric cannot fake
# (e.g. real Profile isolation). See app/src/androidTest.
androidxTestExtJunit = "1.2.1"
androidxTestRunner   = "1.6.2"

[libraries]
androidx-core-ktx                    = { group = "androidx.core",              name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",       version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",   version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose            = { group = "androidx.activity",          name = "activity-compose",            version.ref = "activityCompose" }
androidx-compose-bom                 = { group = "androidx.compose",           name = "compose-bom",                 version.ref = "composeBom" }
androidx-ui                          = { group = "androidx.compose.ui",        name = "ui" }
androidx-ui-graphics                 = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-ui-tooling                  = { group = "androidx.compose.ui",        name = "ui-tooling" }
androidx-ui-tooling-preview          = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-material3                   = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-webkit                      = { group = "androidx.webkit",            name = "webkit",                      version.ref = "webkit" }
androidx-swiperefreshlayout          = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout",         version.ref = "swipeRefresh" }

junit                   = { group = "junit",                 name = "junit",                   version.ref = "junit" }
mockk                   = { group = "io.mockk",              name = "mockk",                   version.ref = "mockk" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
turbine                 = { group = "app.cash.turbine",       name = "turbine",                 version.ref = "turbine" }
robolectric             = { group = "org.robolectric",        name = "robolectric",             version.ref = "robolectric" }
androidx-test-ext-junit = { group = "androidx.test.ext",      name = "junit",                   version.ref = "androidxTestExtJunit" }
androidx-test-runner    = { group = "androidx.test",          name = "runner",                  version.ref = "androidxTestRunner" }

[plugins]
# AGP 9 ships Kotlin built-in — NO external org.jetbrains.kotlin.android plugin.
android-application = { id = "com.android.application",             version.ref = "agp" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
